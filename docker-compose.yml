version: '3.8'
services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama

  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    ports:
      - "8000:8000"
    depends_on:
      - redis
    environment:
      - REDIS_URL=redis://redis:6379/0





  orchestrator-worker:
    build:
      context: .
      dockerfile: Dockerfile.orchestrator
    depends_on:
      - redis
      - ollama
    environment:
      - REDIS_URL=redis://redis:6379/0
      - OLLAMA_HOST=http://ollama:11434

  config-db:
    build:
      context: .
      dockerfile: Dockerfile.configdb
    ports:
      - "8080:8080"

volumes:
  ollama_data:


